- name: 보안입찰 RFP 매칭
  subtitle: 요구사항 · 제품 스펙 갭분석 자동화
  period: 2026.09
  type: personal
  featured: true
  accent: cyan
  summary: >-
    공공기관 입찰공고를 Open API로 수집하고, RFP 요구사항을 보안장비 스펙과 대조해
    충족 · 부분충족 · 미충족 · 확인불가 갭분석표를 자동으로 만들어 주는 시스템입니다.
    공고마다 요구사항을 제품 카탈로그와 한 줄씩 대조하던 작업을 코드로 옮겼습니다.
  stack: [Java 17, Spring Boot, Spring Data JPA, React, TypeScript, MySQL]
  links:
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/dlwldP/rfp-match
  details:
    - heading: 주요 기능
      items:
        - 입찰공고 Open API를 키워드(침입방지·방화벽·DDoS 등)로 주기 폴링해 캐싱
        - 공고별 요구사항 등록과 자사 제품 스펙 CRUD
        - 요구사항과 스펙을 대조해 충족률·필수 미충족 건수까지 요약한 갭분석표 산출
    - heading: 핵심 로직
      items:
        - 외부 API 연동이 아니라 직접 설계한 도메인 판정 규칙이 핵심 — 처리성능·인증등급 등 요구사항 유형별로 비교 규칙을 분리
        - 대응하는 제품 스펙이 없을 때 미충족으로 단정하지 않고 "확인불가"로 분리해, 담당자 확인이 필요한 항목을 드러냄
        - 공고는 실시간 조회 대신 스케줄러로 캐싱해, 외부 API가 죽어도 마지막 수집분으로 화면이 계속 동작
    - heading: 참고
      items:
        - 개인 학습용 프로젝트로, 코드에 등장하는 기관명·제품명은 모두 가상
        - 연동 대상 API의 엔드포인트와 인증키는 저장소에 두지 않고 환경변수로만 주입

- name: 멀티클라우드 견적 자동화
  subtitle: AWS · Azure · GCP 가격 API 비교 견적
  period: 2026.09
  type: personal
  featured: true
  accent: indigo
  summary: >-
    워크로드 스펙(vCPU·메모리·스토리지·리전·OS)을 입력하면 3사 공개 가격 API를 연동해
    벤더별 월 비용을 자동 산출하고 비교해 주는 서비스입니다. 견적 이력을 저장해 재활용하고
    제안용 PDF 견적서로 내보낼 수 있습니다.
  stack: [Java 17, Spring Boot, Spring Data JPA, React, TypeScript, MySQL, Docker]
  links:
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/dlwldP/sales
  details:
    - heading: 주요 기능
      items:
        - 동일 스펙 기준으로 AWS·Azure·GCP 월 비용을 산출해 나란히 비교
        - 견적 이력 저장 및 리전·벤더·기간 필터 조회, 견적서 PDF 내보내기
        - 스케줄러가 매일 벤더별 가격을 수집해 캐싱
    - heading: 설계 선택
      items:
        - 외부 가격 API를 요청 경로에서 직접 호출하지 않고 스케줄러가 수집해 캐시를 서빙 — 응답 속도를 확보하고 외부 API 장애 시에도 마지막 캐시로 서비스가 지속
        - 동기화를 벤더·리전·OS 조합 단위로 분리해, 한 벤더가 실패해도 나머지 캐시는 유지되도록 처리
        - 요청 스펙 이상인 SKU 중 최저 월비용을 매칭하고, 매칭되는 SKU가 없으면 견적을 실패시키지 않고 사유를 담아 반환
    - heading: 한계
      items:
        - Azure 가격 API가 vCPU·메모리를 제공하지 않아 SKU명을 파싱해 스펙을 유추 (비율이 불규칙한 시리즈는 매칭에서 제외)
        - 스토리지 단가는 벤더별 표준 SSD 근사치를 설정값으로 사용

- name: stock-monitor
  subtitle: 증권사 Open API 연동 관심종목 알림 · 자산 대시보드
  period: 2026.08
  type: personal
  featured: true
  accent: amber
  summary: >-
    토스증권 Open API를 연동해 관심종목 알림과 자산 대시보드를 한 서비스로 제공하는 백엔드 중심 프로젝트입니다.
    실계좌 연동 동작까지 확인했고, API 키 없이도 Mock 시세로 전 기능이 동작하도록 설계했습니다.
  stack: [Java 21, Spring Boot, Spring Data JPA, React, TypeScript, H2/MySQL]
  links:
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/dlwldP/stock-monitor
  details:
    - heading: 주요 기능
      items:
        - 관심종목 시세·손익, 보유종목, 자산 추이를 한 화면에서 보여주는 대시보드 (일봉 캔들 차트 자체 SVG 렌더링)
        - 목표가/등락률/거래량 급증/52주 신고가·신저가 등 6가지 조건의 알림 규칙, 디스코드·이메일·인앱 채널 발송
        - 60초 주기 스케줄러로 알림 조건 평가, 매일 자산현황 요약을 보내는 다이제스트 이메일
    - heading: 기술적 선택
      items:
        - TossApiClient 인터페이스로 Mock/실 API 구현체를 분리해, 키가 없어도 랜덤워크 가상 시세로 전 기능이 동작하도록 설계
        - 문서화되지 않은 API 응답 구조를 직접 호출해 검증하고, 매핑을 회귀 테스트로 고정해 스키마 변경 시 조용히 깨지지 않도록 방지
        - gzip 압축 에러 응답 처리, 타임존이 밀리는 캔들 타임스탬프를 문자열로 파싱하는 등 실 API 연동 과정의 예외 케이스 대응
    - heading: 배운 점
      items:
        - 실계좌 연동까지 검증하며 외부 금융 API의 인증·에러 처리·레이트리밋 대응 경험
        - 민감정보(키·계좌번호)를 레포에 커밋하지 않고 환경변수로만 주입하는 설계 원칙 적용

- name: Deploy-gate
  subtitle: claims 기반 인프라 배포 승인 게이트
  period: 2026.07 – 2026.08
  type: personal
  featured: true
  accent: rose
  summary: >-
    CI/CD 파이프라인에서 배포 직전에 호출되어, 요청자가 해당 인프라 스택을 배포할 권한이 있는지
    판단하는 인가 서비스입니다. 저장소 write 권한만으로는 구분되지 않는 "이 스택을 배포해도 되는가"를
    claims와 정책 매칭이라는 결정론적 규칙으로 판정합니다.
  stack: [Spring Boot, Spring Security, JPA, SQLite, React, AWS CDK]
  links:
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/dlwldP/Deploy-gate
  details:
    - heading: 해결한 문제
      items:
        - 저장소 write 권한과 인프라 배포 권한이 동일시되던 문제를 분리
        - 테스트 스택은 즉시 배포, 운영 스택은 승인 필요 — 스택별로 승인 단계를 다르게 적용
        - 배포 승인·거부 이력이 남지 않아 사후 추적이 안 되던 문제를 감사 로그로 해결
    - heading: 설계
      items:
        - 승인 단계(없음 / 1인 / 2인)를 ApprovalPolicy 추상 클래스로 다형성 분기하고, 정책은 판단만 하는 순수 함수로 분리
        - 승인권자를 별도 개념으로 두지 않고 "해당 스택의 approve claim 보유자"로 모델링
        - 요청 생성 시점의 필요 승인 수를 스냅샷으로 저장해, 정책이 바뀌어도 진행 중인 요청이 흔들리지 않도록 처리
    - heading: 보안 설계
      items:
        - 승인·거부의 신원을 요청 본문이 아닌 토큰에서만 도출해 타인 명의 사칭을 차단
        - CI 서비스 토큰은 승인 투표 권한이 없어, 파이프라인 시크릿이 유출돼도 스스로 배포를 승인할 수 없음
        - 요청자 본인이 자기 요청을 승인할 수 없는 4-eyes 원칙 적용, 토큰은 SHA-256 해시로만 저장

- name: 보험 보장 분석 데모
  subtitle: LLM 기반 소명 근거 자동 생성
  period: 2026.02
  type: personal
  featured: true
  accent: violet
  summary: >-
    보험 지급 거절 통보서를 업로드하면 약관을 근거로 소명 가능성과 반박 논리를 자동 생성하는
    AI 프로토타입입니다. 문제 정의부터 기획, 개발까지 전 과정을 단독으로 진행했습니다.
  stack: [Next.js, TypeScript, Tailwind CSS, Claude API]
  links:
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/dlwldP/banksalad
  details:
    - heading: 문제 정의
      items:
        - 보험 약관의 복잡성 때문에 지급 거절 시 대부분의 고객이 소명을 포기하는 문제에 주목
        - 거절 통보서 한 장으로 약관 역산 → 소명 근거 도출 → 메시지 생성 3단계를 자동화
    - heading: 주요 기능
      items:
        - PDF 드래그앤드롭 업로드 후 거절 통보서 자동 분석
        - 보험사·진단명·청구 금액·거절 사유를 카드 형태로 시각화
        - 약관 논리 기반 소명 성공률 예측 및 핵심 반박 근거 자동 추출
        - 소명 편지 자동 작성 및 복사 기능
    - heading: 기술적 선택
      items:
        - OCR 없이 PDF를 base64로 인코딩해 모델에 직접 전달, 약관 원문 전체를 분석에 활용
        - 시스템 프롬프트로 JSON 구조화 출력을 강제해 프론트엔드에서 바로 파싱
        - API 키를 서버 라우트에서만 처리해 브라우저에 노출되지 않도록 설계
    - heading: 한계
      items:
        - 법적 효력이 있는 소명 자료가 아닌 시연 목적의 프로토타입
        - 진료 기록과 결합한 손해사정 리포트 기능은 확장 과제로 남김

