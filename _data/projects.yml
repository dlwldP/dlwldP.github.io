- name: AWS 얼마야? (Awscal)
  rank: 3
  subtitle: 초보자용 AWS 비용 계산기
  period: "2026.10"
  year: 2026
  month: 10
  type: personal
  featured: true
  accent: violet
  summary: >-
    "하고 싶은 것"을 고르면 필요한 AWS 구성안 2~3가지와 예상 월 비용을 비교해 주고,
    쓸 서비스를 이미 안다면 직접 담아 합계를 계산할 수 있는 웹 계산기입니다.
    AWS 계정이나 API 키 없이 쓸 수 있는 정적 사이트이고, 가격 데이터는 매주 자동으로 갱신됩니다.
  stack: [JavaScript, HTML/CSS, Python, GitHub Actions, GitHub Pages]
  links:
    - label: 서비스 바로가기
      icon: fas fa-arrow-up-right-from-square
      url: https://dlwldp.github.io/Awscal/
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/dlwldP/Awscal
  details:
    - heading: 주요 기능
      items:
        - 구성 추천 — 템플릿 4종(정적 웹사이트·백엔드 웹앱·서버리스 API·개발용 단일 서버) × 규모 프리셋 3종 × 리전 2곳(서울·버지니아 북부)
        - 항목별 금액과 "이 비용은 왜 나오나요?" 설명, 퍼블릭 IPv4·NAT Gateway·데이터 전송·Multi-AZ 등 숨은 비용 경고
        - 직접 계산 — EC2·RDS·S3·Lambda·ECS Fargate 등 15종 서비스를 담아 사용 시간·Multi-AZ 옵션까지 반영해 합계 계산
    - heading: 가격 데이터 파이프라인
      items:
        - AWS Price List Bulk API의 공개 CSV를 스트리밍으로 읽어 필요한 SKU만 추출(인증 불필요, 표준 라이브러리만 사용)
        - GitHub Actions가 매주 월요일 가격을 다시 수집해 커밋·재배포하고, 항목 누락이나 단가가 애매하면 실패 처리해 기존 가격을 유지
    - heading: 설계와 검증
      items:
        - 계산 엔진을 DOM과 분리하고 Node 내장 테스트 러너로 단위 테스트, 템플릿은 JSON만 수정하면 추가되도록 데이터 주도 구조로 설계
        - 템플릿 × 프리셋 × 리전 × 구성안 48개 조합을 AWS 공식 계산기와 교차 검증하는 체크리스트(±10% 기준)를 자동 생성
        - 빌드 없는 순수 HTML/CSS/JS 정적 사이트라 서버·운영비 없이 GitHub Pages로 배포

- name: KubeLens
  rank: 2
  subtitle: 자연어로 질의하는 Kubernetes 장애 진단 에이전트
  period: "2026.10"
  year: 2026
  month: 10
  type: personal
  featured: true
  accent: pink
  summary: >-
    "왜 이 파드가 죽었어?"라고 물으면 클러스터를 read-only로 조회해, 실제 조회 결과를
    근거로 붙인 원인 후보와 다음 조치 제안을 보여주는 진단 도구입니다. 쓰기 권한을
    RBAC와 코드 양쪽에서 차단하고, 장애 시나리오 6종을 자동 채점하는 평가 하네스로
    정확도를 수치로 측정합니다.
  stack: [Python, LangGraph, FastAPI, React, TypeScript, kind]
  links:
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/dlwldP/KubeLens
  details:
    - heading: 핵심 설계 — Read-only by construction
      items:
        - RBAC(쓰기·secret·exec 권한 없음)와 코드(get/list만 노출하는 ReadOnlyKube, 8개 도구 allowlist)로 이중 차단
        - 쓰기 API 호출·셸 실행·secret 접근이 소스에 없는지를 AST로 검사하는 테스트까지 작성해 회귀를 방지
        - 로그·이벤트에 섞인 토큰·비밀번호·JWT·AWS 키를 LLM에 전달하기 전에 마스킹, kubeconfig 자체는 LLM에 보내지 않음
    - heading: 증거 기반 응답
      items:
        - 도구 호출마다 ID를 부여하고, 모든 원인 후보는 실제 존재하는 호출 ID를 1개 이상 인용해야 함 — 없으면 1회 재생성, 그래도 없으면 실패로 표시
        - 질문당 도구 호출 최대 8회, 로그 tail 200줄, 출력 4,000자 절단으로 비용 상한을 둠
    - heading: 정확도를 수치로 측정
      items:
        - kind 클러스터에 CrashLoopBackOff·ImagePullBackOff·OOMKilled 등 장애 6종(S1~S6)을 재현해 자동 진단·채점하는 평가 하네스 작성
        - 1순위 원인 후보에 정답 키워드가 모두 포함되는지, 증거 검증 실패나 비밀값 노출이 없는지까지 함께 채점
    - heading: 배운 점
      items:
        - 에이전트가 쓸 수 있는 도구 수를 8개로 제한하고 allowlist화하는 것이 안전성과 비용 통제에 동시에 효과적이라는 것을 확인
        - LLM 출력에 '근거 인용 의무'를 강제하는 구조가 환각으로 인한 오진단을 크게 줄인다는 것을 체감

- name: Subhelp
  subtitle: 구독 관리 iOS 앱
  period: "2026.10"
  year: 2026
  month: 10
  type: personal
  featured: true
  accent: emerald
  summary: >-
    흩어진 구독 결제를 한곳에 모아 언제·얼마가 빠져나가는지 미리 알려주는 iOS 앱입니다.
    기본은 로그인 없이 기기 저장만으로 전 기능이 동작하고, 원하면 Apple 로그인으로
    Supabase에 백업·동기화합니다.
  stack: [Swift, SwiftUI, SwiftData, WidgetKit, Swift Charts, Supabase]
  links:
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/dlwldP/Subhelp
  details:
    - heading: 주요 기능
      items:
        - 구독 등록·목록·상세, D-day 배지, 결제 알림(당일/1/3/7일 전), 무료체험 알림
        - 홈·잠금화면 위젯, 카테고리별 지출 도넛 차트, 결제 캘린더, 비싼 구독 순위
        - Apple 로그인 시 Supabase로 백업·동기화, 로그인하지 않아도 기기 저장만으로 전 기능 동작
    - heading: 기술적 선택
      items:
        - MVVM 대신 @Query + Domain 계층 분리 — 목록 조회는 뷰에서 @Query로, 결제일·금액 계산은 순수 struct로 분리해 단위 테스트 가능하게 설계
        - 금액은 Decimal로 계산해 부동소수 오차를 방지하고, 다음 결제일·월 환산은 저장하지 않고 매번 계산해 데이터 불일치를 방지
        - 동기화는 Last-Write-Wins + 삭제 tombstone(deleted_at)으로 여러 기기 변경을 병합, 수정 시각은 서버 정밀도(밀리초)에 맞춰 저장
    - heading: 트러블슈팅
      items:
        - 월말 결제일이 밀리는 문제(1/31 → 2/28 → 3/28)를 "최초 결제일 + n번째 주기"로 재계산해 해결
        - 로컬 알림 64개 한도에 걸리지 않도록 구독마다 다음 2회분만 예약하고, 변경 시 전체를 재예약
        - 위젯과 앱 간 데이터 공유를 App Group 컨테이너의 SwiftData로 구현, 변경 시 WidgetCenter로 위젯을 갱신

