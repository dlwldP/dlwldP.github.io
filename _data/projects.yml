        - 민감정보(키·계좌번호)를 레포에 커밋하지 않고 환경변수로만 주입하는 설계 원칙 적용

- name: Deploy-gate
  rank: 4
  subtitle: claims 기반 인프라 배포 승인 게이트
  period: 2026.07 – 2026.08
  year: 2026
  month: 8
  type: personal
  featured: true
  accent: rose
  summary: >-
    CI/CD 파이프라인에서 배포 직전에 호출되어, 요청자가 해당 인프라 스택을 배포할 권한이 있는지
    판단하는 인가 서비스입니다. 저장소 write 권한만으로는 구분되지 않는 "이 스택을 배포해도 되는가"를
    claims와 정책 매칭이라는 결정론적 규칙으로 판정합니다.
  stack: [Spring Boot, Spring Security, JPA, SQLite, React, AWS CDK]
  links:
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/dlwldP/Deploy-gate
  details:
    - heading: 해결한 문제
      items:
        - 저장소 write 권한과 인프라 배포 권한이 동일시되던 문제를 분리
        - 테스트 스택은 즉시 배포, 운영 스택은 승인 필요 — 스택별로 승인 단계를 다르게 적용
        - 배포 승인·거부 이력이 남지 않아 사후 추적이 안 되던 문제를 감사 로그로 해결
    - heading: 설계
      items:
        - 승인 단계(없음 / 1인 / 2인)를 ApprovalPolicy 추상 클래스로 다형성 분기하고, 정책은 판단만 하는 순수 함수로 분리
        - 승인권자를 별도 개념으로 두지 않고 "해당 스택의 approve claim 보유자"로 모델링
        - 요청 생성 시점의 필요 승인 수를 스냅샷으로 저장해, 정책이 바뀌어도 진행 중인 요청이 흔들리지 않도록 처리
    - heading: 보안 설계
      items:
        - 승인·거부의 신원을 요청 본문이 아닌 토큰에서만 도출해 타인 명의 사칭을 차단
        - CI 서비스 토큰은 승인 투표 권한이 없어, 파이프라인 시크릿이 유출돼도 스스로 배포를 승인할 수 없음
        - 요청자 본인이 자기 요청을 승인할 수 없는 4-eyes 원칙 적용, 토큰은 SHA-256 해시로만 저장

- name: 보험 보장 분석 데모
  subtitle: LLM 기반 소명 근거 자동 생성
  period: 2026.02
  year: 2026
  month: 2
  type: personal
  featured: true
  accent: violet
  summary: >-
    보험 지급 거절 통보서를 업로드하면 약관을 근거로 소명 가능성과 반박 논리를 자동 생성하는
    AI 프로토타입입니다. 문제 정의부터 기획, 개발까지 전 과정을 단독으로 진행했습니다.
  stack: [Next.js, TypeScript, Tailwind CSS, Claude API]
  links:
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/dlwldP/banksalad
  details:
    - heading: 문제 정의
      items:
        - 보험 약관의 복잡성 때문에 지급 거절 시 대부분의 고객이 소명을 포기하는 문제에 주목
        - 거절 통보서 한 장으로 약관 역산 → 소명 근거 도출 → 메시지 생성 3단계를 자동화
    - heading: 주요 기능
      items:
        - PDF 드래그앤드롭 업로드 후 거절 통보서 자동 분석
        - 보험사·진단명·청구 금액·거절 사유를 카드 형태로 시각화
        - 약관 논리 기반 소명 성공률 예측 및 핵심 반박 근거 자동 추출
        - 소명 편지 자동 작성 및 복사 기능
    - heading: 기술적 선택
      items:
        - OCR 없이 PDF를 base64로 인코딩해 모델에 직접 전달, 약관 원문 전체를 분석에 활용
        - 시스템 프롬프트로 JSON 구조화 출력을 강제해 프론트엔드에서 바로 파싱
        - API 키를 서버 라우트에서만 처리해 브라우저에 노출되지 않도록 설계
    - heading: 한계
      items:
        - 법적 효력이 있는 소명 자료가 아닌 시연 목적의 프로토타입
        - 진료 기록과 결합한 손해사정 리포트 기능은 확장 과제로 남김

