        - 대응하는 제품 스펙이 없을 때 미충족으로 단정하지 않고 "확인불가"로 분리해, 담당자 확인이 필요한 항목을 드러냄
        - 공고는 실시간 조회 대신 스케줄러로 캐싱해, 외부 API가 죽어도 마지막 수집분으로 화면이 계속 동작
